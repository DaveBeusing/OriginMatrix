<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OriginMatrix</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>OriginMatrix</h1>
        <span class="phase">Phase 4</span>
      </header>
      <dl><div><dt>Site</dt><dd id="site">Loading…</dd></div></dl>
      <section aria-labelledby="matrix-title">
        <div class="section-heading">
          <h2 id="matrix-title">Observed domains</h2>
          <div class="metrics">
            <span><strong id="request-count">0</strong> requests</span>
            <span><strong id="domain-count">0</strong> domains</span>
            <span><strong id="failed-count">0</strong> failed</span>
          </div>
        </div>
        <div class="matrix-scroll">
          <table id="matrix">
            <thead><tr><th scope="col">Domain</th><th scope="col">JS</th><th scope="col">XHR</th><th scope="col">FRM</th><th scope="col">IMG</th><th scope="col">MED</th></tr></thead>
            <tbody id="matrix-body"><tr><td colspan="6" class="empty">Reload to collect requests.</td></tr></tbody>
          </table>
        </div>
      </section>
      <div class="legend" aria-label="Matrix legend"><span class="allow">allow</span><span class="block">block</span><span class="inherit">inherit</span></div>
      <p id="notice" role="status" aria-live="polite"></p>
      <div class="actions"><button id="reload" type="button" disabled>Reload page</button></div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
