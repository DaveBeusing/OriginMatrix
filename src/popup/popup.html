<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OriginMatrix</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>OriginMatrix</h1>
        <span class="phase">v0.15</span>
      </header>
      <dl>
        <div><dt>Site</dt><dd id="site">Loading…</dd></div>
        <div><dt>Protection</dt><dd id="protection" data-enabled="false">Checking…</dd></div>
      </dl>
      <section aria-labelledby="matrix-title">
        <div class="section-heading">
          <h2 id="matrix-title">Observed domains</h2>
          <div class="metrics">
            <span><strong id="request-count">0</strong> requests</span>
            <span><strong id="domain-count">0</strong> domains</span>
            <span><strong id="failed-count">0</strong> failed</span>
          </div>
        </div>
        <div class="matrix-scroll">
          <table id="matrix">
            <thead><tr><th scope="col">Domain</th><th scope="col">ALL</th><th scope="col">C</th><th scope="col">CSS</th><th scope="col">IMG</th><th scope="col">MED</th><th scope="col">JS</th><th scope="col">XHR</th><th scope="col">FRM</th><th scope="col">FNT</th><th scope="col">WS</th><th scope="col">OTH</th></tr></thead>
            <tbody id="matrix-body"><tr><td colspan="12" class="empty">Loading matrix…</td></tr></tbody>
          </table>
        </div>
      </section>
      <div class="legend" aria-label="Matrix legend"><span class="allow">allow</span><span class="block">block</span><span class="inherit">inherit</span></div>
      <p class="cookie-note">Cookie cells cycle between inherit and block.</p>
      <div class="change-state"><span id="pending-count">0 temporary changes</span><strong id="reload-required" hidden>Reload required</strong></div>
      <p id="notice" role="status" aria-live="polite"></p>
      <div class="actions">
        <button id="revert" class="secondary" type="button" disabled>Revert</button>
        <button id="commit" type="button" disabled>Commit</button>
        <button id="reload" class="secondary" type="button" disabled>Reload page</button>
        <button id="settings" class="secondary" type="button">Settings</button>
      </div>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
